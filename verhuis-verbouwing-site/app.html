<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verhuis &amp; Verbouwing — checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="gate-loading" id="gate">Toegang wordt gecontroleerd…</div>

<div class="sheet" id="app" style="display:none;">
  <header class="masthead">
    <h1 class="title"><small>Werfbon &middot; opvolging</small>Verhuis &amp; Verbouwing</h1>
    <div class="who">
      Aangemeld als <b id="who-name">—</b>
      <button class="btn ghost small" id="btn-logout">Afmelden</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-list="verhuis">Verhuis</button>
    <button class="tab" data-list="verbouwing">Verbouwing</button>
  </nav>

  <div class="tape-wrap">
    <div class="tape-label">
      <span id="progress-label">0 / 0 afgevinkt</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="tape"><div class="tape-fill" id="tape-fill"></div></div>
  </div>

  <div id="categories"><!-- filled by js --></div>

  <div class="add-category">
    <input type="text" id="new-category" placeholder="Nieuwe categorie (optioneel, laat leeg voor 'Overig')">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
