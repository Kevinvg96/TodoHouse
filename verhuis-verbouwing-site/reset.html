<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wachtwoord herstellen — Verhuis &amp; Verbouwing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="setup-check"></div>

<div class="login-shell" id="login-shell" style="display:flex;">
  <div class="login-card">
    <p class="eyebrow">Wachtwoord herstellen</p>
    <h1>Nieuw wachtwoord</h1>

    <div id="reset-wait" class="msg show ok">Link wordt gecontroleerd…</div>

    <div id="reset-form" style="display:none;">
      <div class="field">
        <label for="pw1">Nieuw wachtwoord</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="Minstens 12 tekens">
      </div>
      <div class="field">
        <label for="pw2">Herhaal wachtwoord</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="Nogmaals">
      </div>
      <div class="login-actions">
        <button class="btn" id="btn-save">Wachtwoord opslaan</button>
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <p class="login-foot"><a href="index.html">&larr; Terug naar aanmelden</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/reset.js"></script>
</body>
</html>
